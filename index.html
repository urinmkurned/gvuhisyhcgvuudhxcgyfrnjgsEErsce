<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Landing</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&display=swap');
        body {
            font-family: 'Fira Code', monospace;
            background-color: #05070f;
            color: #f43f5e;
            overflow: hidden;
            margin: 0;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative select-none">

    <div id="terminal" class="z-10 text-left p-6 max-w-lg w-full bg-[#070b14] border border-rose-950 rounded-lg shadow-2xl transition-opacity duration-1000">
        <div class="text-sm text-gray-600 mb-4">[system] Initializing heart.PROTOCOL_v5.1...</div>
        <div id="log" class="text-rose-400 mb-6 min-h-[72px]"></div>
        
        <button id="decrypt-btn" class="hidden w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded border border-rose-400 shadow-[0_0_15px_rgba(244,63,94,0.5)] transition-all cursor-pointer uppercase tracking-wider text-sm animate-pulse">
            🔓 Decrypt Message
        </button>
        <div id="hint" class="hidden text-center text-xs text-gray-600 mt-2">(or just click anywhere)</div>
    </div>

    <canvas id="heartCanvas" class="absolute inset-0 opacity-0 transition-opacity duration-1000 pointer-events-auto"></canvas>

    <script>
        const terminal = document.getElementById('terminal');
        const logDiv = document.getElementById('log');
        const decryptBtn = document.getElementById('decrypt-btn');
        const hint = document.getElementById('hint');
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        const lines = [
            "> Scanning network...",
            "> One encrypted package found for you.",
            "> Ready for decryption."
        ];

        let lineIdx = 0;
        function typeLog() {
            if (lineIdx < lines.length) {
                logDiv.innerHTML += lines[lineIdx] + "<br>";
                lineIdx++;
                setTimeout(typeLog, 400);
            } else {
                decryptBtn.classList.remove('hidden');
                hint.classList.remove('hidden');
            }
        }
        setTimeout(typeLog, 300);

        function startHeartEffect() {
            terminal.classList.add('opacity-0');
            setTimeout(() => terminal.remove(), 1000);

            canvas.classList.remove('opacity-0');
            resizeCanvas();
            initHeart();
            initBackground();
            animate();
        }

        decryptBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startHeartEffect();
        });
        window.addEventListener('click', () => {
            if (!decryptBtn.classList.contains('hidden')) startHeartEffect();
        });

        // --- POZYCJA MYSZKI (ODPYCHANIE) ---
        const mouse = { x: null, y: null, radius: 80 };
        window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        window.addEventListener('mouseleave', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
        });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });

        // --- SILNIK I ZMIENNE ANIMACJI ---
        let particles = [];
        let bgParticles = [];
        const textToDisplay = "love you";
        let rotationSpeed = 0.08; 
        let globalRotation = 0;
        let pulseAngle = 0;
        let photoOpacity = 0; 

        // Ładowanie Twojego zdjęcia z Imgura
        const userImg = new Image();
        userImg.crossOrigin = "anonymous"; // Zapobiega błędom bezpieczeństwa (CORS) przy rysowaniu na canvas
        userImg.src = 'https://i.imgur.com/oAkQE07.jpeg';

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            initHeart();
            initBackground();
        });

        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * scale * 0.85, y: -y * scale * 0.85 };
        }

        class BgParticle {
            constructor() {
                this.x = Math.random() * window.innerWidth;
                this.y = Math.random() * window.innerHeight;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedY = Math.random() * 0.3 + 0.1;
                this.opacity = Math.random() * 0.4 + 0.1;
            }
            update() {
                this.y += this.speedY;
                if (this.y > window.innerHeight) {
                    this.y = 0;
                    this.x = Math.random() * window.innerWidth;
                }
            }
            draw() {
                ctx.fillStyle = `rgba(244, 63, 94, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Particle {
            constructor(angle, scale, zOffset) {
                this.angle = angle;
                this.scale = scale;
                this.z = zOffset; 
                this.basePoint = getHeartPoint(this.angle, this.scale);
                
                this.x = window.innerWidth / 2 + (Math.random() - 0.5) * 300;
                this.y = window.innerHeight / 2 + (Math.random() - 0.5) * 300;
                
                this.fontSize = Math.floor(Math.random() * 3) + 11; 
                this.opacity = 0;
            }

            update() {
                let x3d = this.basePoint.x * Math.cos(globalRotation) - this.z * Math.sin(globalRotation);
                let z3d = this.basePoint.x * Math.sin(globalRotation) + this.z * Math.cos(globalRotation);

                const fov = 400; 
                const perspective = fov / (fov + z3d);

                let pulse = 1;
                if (rotationSpeed < 0.001) {
                    pulse = 1 + Math.sin(pulseAngle) * 0.04;
                }

                const targetX = (window.innerWidth / 2) + x3d * perspective * pulse;
                const targetY = (window.innerHeight / 2) + this.basePoint.y * perspective * pulse;

                if (mouse.x !== null && mouse.y !== null) {
                    let dx = this.x - mouse.x;
                    let dy = this.y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouse.radius && rotationSpeed < 0.01) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        this.x += (dx / distance) * force * 14;
                        this.y += (dy / distance) * force * 14;
                    }
                }

                this.x += (targetX - this.x) * 0.05;
                this.y += (targetY - this.y) * 0.05;

                if (this.opacity < 1) this.opacity += 0.02;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.globalAlpha = this.opacity;
                
                ctx.font = `600 ${this.fontSize}px 'Fira Code', monospace`;
                ctx.shadowColor = "#f43f5e";
                ctx.shadowBlur = rotationSpeed < 0.01 ? 6 : 2; 
                ctx.fillStyle = "#f43f5e";

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(textToDisplay, 0, 0);
                ctx.restore();
            }
        }

        function initBackground() {
            bgParticles = [];
            for (let i = 0; i < 60; i++) {
                bgParticles.push(new BgParticle());
            }
        }

        function initHeart() {
            particles = [];
            const totalParticles = 440; 
            
            for (let i = 0; i < totalParticles; i++) {
                const angle = (i / totalParticles) * Math.PI * 2;
                const scale = 11 + Math.random() * 3;
                const zOffset = (Math.random() - 0.5) * 60; 
                particles.push(new Particle(angle, scale, zOffset));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            // 1. Tło gwiazd
            bgParticles.forEach(bp => {
                bp.update();
                bp.draw();
            });

            // 2. Obsługa obrotu i hamowania
            globalRotation += rotationSpeed;
            rotationSpeed *= 0.982; 

            let pulse = 1;
            if (rotationSpeed < 0.0005) {
                rotationSpeed = 0;
                const remainder = globalRotation % (Math.PI * 2);
                globalRotation += (0 - remainder) * 0.1; 
                pulseAngle += 0.08;
                pulse = 1 + Math.sin(pulseAngle) * 0.04;

                if (photoOpacity < 1) photoOpacity += 0.015;
            }

            // 3. Rysowanie Twojego zdjęcia w środku uformowanego serca
            if (photoOpacity > 0 && userImg.complete) {
                ctx.save();
                
                // Rozmiar okrągłego portretu wewnątrz serca
                const size = 150 * pulse;
                const imgX = (window.innerWidth / 2) - (size / 2);
                const imgY = (window.innerHeight / 2) - (size / 2) - 15 * pulse; 

                ctx.globalAlpha = photoOpacity;

                // Efekt mocnego, różowego neonowego blasku wokół zdjęcia
                ctx.shadowColor = "#f43f5e";
                ctx.shadowBlur = 25;

                // Wycinanie maski koła, żeby zdjęcie było idealnie okrągłe
                ctx.beginPath();
                ctx.arc(window.innerWidth / 2, (window.innerHeight / 2) - 15 * pulse, size / 2, 0, Math.PI * 2);
                ctx.clip();

                // Rysowanie zdjęcia dopasowanego do proporcji kwadratu/okręgu
                ctx.drawImage(userImg, imgX, imgY, size, size);
                
                ctx.restore();
                
                // Dodatkowa, estetyczna cienka neonowa ramka wokół zdjęcia
                ctx.save();
                ctx.globalAlpha = photoOpacity;
                ctx.shadowColor = "#f43f5e";
                ctx.shadowBlur = 10;
                ctx.strokeStyle = "rgba(244, 63, 94, 0.8)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(window.innerWidth / 2, (window.innerHeight / 2) - 15 * pulse, size / 2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // 4. Napisy "love you" tworzące serce (na samym wierzchu)
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
