<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Landing</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@600;700&display=swap');
        body {
            font-family: 'Fira Code', monospace;
            background-color: #0b0f19;
            color: #f43f5e;
            overflow: hidden;
            margin: 0;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center relative select-none">

    <div id="terminal" class="z-10 text-left p-6 max-w-lg w-full bg-[#0d1321] border border-rose-900/30 rounded-lg shadow-2xl transition-opacity duration-1000">
        <div class="text-sm text-gray-500 mb-4">[system] Initializing heart.PROTOCOL_v3.0...</div>
        <div id="log" class="text-rose-400 mb-6 min-h-[72px]"></div>
        
        <button id="decrypt-btn" class="hidden w-full py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded border border-rose-400 shadow-[0_0_15px_rgba(244,63,94,0.5)] transition-all cursor-pointer uppercase tracking-wider text-sm animate-pulse">
            🔓 Decrypt Message
        </button>
        <div id="hint" class="hidden text-center text-xs text-gray-600 mt-2">(or just click anywhere)</div>
    </div>

    <canvas id="heartCanvas" class="absolute inset-0 opacity-0 transition-opacity duration-1000 pointer-events-none"></canvas>

    <script>
        const terminal = document.getElementById('terminal');
        const logDiv = document.getElementById('log');
        const decryptBtn = document.getElementById('decrypt-btn');
        const hint = document.getElementById('hint');
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        const lines = [
            "> Scanning network...",
            "> One encrypted package found for you.",
            "> Ready for decryption."
        ];

        let lineIdx = 0;
        function typeLog() {
            if (lineIdx < lines.length) {
                logDiv.innerHTML += lines[lineIdx] + "<br>";
                lineIdx++;
                setTimeout(typeLog, 400);
            } else {
                decryptBtn.classList.remove('hidden');
                hint.classList.remove('hidden');
            }
        }
        setTimeout(typeLog, 300);

        function startHeartEffect() {
            terminal.classList.add('opacity-0');
            setTimeout(() => terminal.remove(), 1000);

            canvas.classList.remove('opacity-0');
            resizeCanvas();
            initHeart();
            animate();
        }

        decryptBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startHeartEffect();
        });
        window.addEventListener('click', () => {
            if (!decryptBtn.classList.contains('hidden')) startHeartEffect();
        });

        // --- SEKCJA ANIMACJI ---
        let particles = [];
        const textToDisplay = "love you";
        let rotationSpeed = 0.08; // Początkowa duża prędkość rotacji przy wybuchu
        let globalRotation = 0;
        let pulseAngle = 0;

        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = `${window.innerWidth}px`;
            canvas.style.height = `${window.innerHeight}px`;
            ctx.scale(dpr, dpr);
        }
        window.addEventListener('resize', () => {
            resizeCanvas();
            initHeart();
        });

        // Poprawiona, bardziej "anatomiczna" i gęsta formuła serca (Krzywa sercowa)
        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            // Ulepszone parametry Y dające ładniejsze wcięcie u góry i ostrzejszy dół
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            return { x: x * scale * 0.85, y: -y * scale * 0.85 };
        }

        class Particle {
            constructor(angle, scale, zOffset) {
                this.angle = angle;
                this.scale = scale;
                this.z = zOffset; 
                
                this.basePoint = getHeartPoint(this.angle, this.scale);
                
                // Efekt eksplozji: startują ze środka ekranu z wielką prędkością na zewnątrz
                this.x = window.innerWidth / 2 + (Math.random() - 0.5) * 100;
                this.y = window.innerHeight / 2 + (Math.random() - 0.5) * 100;
                
                this.fontSize = Math.floor(Math.random() * 3) + 11; // 11px - 13px
                this.opacity = 0;
            }

            update() {
                // Obliczanie pozycji 3D z uwzględnieniem globalnego obrotu całej struktury
                let x3d = this.basePoint.x * Math.cos(globalRotation) - this.z * Math.sin(globalRotation);
                let z3d = this.basePoint.x * Math.sin(globalRotation) + this.z * Math.cos(globalRotation);

                const fov = 400; 
                const perspective = fov / (fov + z3d);

                // Dodajemy efekt bicia serca (pulsowanie skali pod koniec animacji)
                let pulse = 1;
                if (rotationSpeed < 0.001) {
                    pulse = 1 + Math.sin(pulseAngle) * 0.04;
                }

                const targetX = (window.innerWidth / 2) + x3d * perspective * pulse;
                const targetY = (window.innerHeight / 2) + this.basePoint.y * perspective * pulse;

                // Stopniowe przyciąganie cząsteczek na swoje miejsca
                this.x += (targetX - this.x) * 0.04;
                this.y += (targetY - this.y) * 0.04;

                if (this.opacity < 1) this.opacity += 0.02;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.globalAlpha = this.opacity;
                
                ctx.font = `600 ${this.fontSize}px 'Fira Code', monospace`;
                
                // Gdy serce stoi, mocniej świeci (efekt neonu)
                ctx.shadowColor = "#f43f5e";
                ctx.shadowBlur = rotationSpeed < 0.01 ? 6 : 2; 
                ctx.fillStyle = "#f43f5e";

                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(textToDisplay, 0, 0);
                ctx.restore();
            }
        }

        function initHeart() {
            particles = [];
            const totalParticles = 400; // Więcej cząsteczek = lepiej widoczny kształt
            
            for (let i = 0; i < totalParticles; i++) {
                // Rozrzucenie punktów po obwodzie serca
                const angle = (i / totalParticles) * Math.PI * 2;
                
                // Warstwowość (nadaje efekt 3D "grubego" serca)
                const scale = 11 + Math.random() * 3;
                const zOffset = (Math.random() - 0.5) * 60; 
                
                particles.push(new Particle(angle, scale, zOffset));
            }
        }

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

            // Zarządzanie obrotem: stopniowo zwalnia (tłumienie)
            globalRotation += rotationSpeed;
            rotationSpeed *= 0.982; // Współczynnik zwalniania

            // Gdy prawie się zatrzyma, zerujemy prędkość i ustawiamy idealnie przodem
            if (rotationSpeed < 0.0005) {
                rotationSpeed = 0;
                // Wyrównanie do pełnego obrotu, żeby serce patrzyło na wprost
                const remainder = globalRotation % (Math.PI * 2);
                globalRotation += (0 - remainder) * 0.1; 
                
                // Uruchomienie pulsowania (bicia serca)
                pulseAngle += 0.08;
            }

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
